<!DOCTYPE html>
<html>
<body style="background:#111; color:#fff; padding:30px;">
    <h2>Admin Panel</h2>
    Period: <input type="text" id="p"><br><br>
    Color: <select id="c"><option value="RED">RED</option><option value="GREEN">GREEN</option></select><br><br>
    Pattern A: <input type="number" id="n1"><br><br>
    Pattern B: <input type="number" id="n2"><br><br>
    <button onclick="send()">UPDATE DASHBOARD</button>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        function send() {
            socket.emit('adminUpdate', {
                period: document.getElementById('p').value,
                color: document.getElementById('c').value,
                numberSmall: document.getElementById('n1').value,
                numberBig: document.getElementById('n2').value
            });
            alert('Updated!');
        }
    </script>
</body>
</html>
