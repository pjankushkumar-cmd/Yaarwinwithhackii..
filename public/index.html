<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win with Hackii - Detective AI Dashboard</title>
    <style>
        :root { --gold: #ffd700; --neon-green: #39ff14; --neon-cyan: #00ffff; --neon-pink: #ff00ff; --neon-red: #ff3131; }
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .timer-box { font-size: 18px; color: var(--gold); margin: 15px 0; text-shadow: 0 0 12px rgba(255, 170, 0, 0.45); font-weight: 700; background: rgba(0, 0, 0, 0.5); padding: 14px; border-radius: 14px; border: 1px dashed rgba(255, 170, 0, 0.35); letter-spacing: 0.5px; }
        .blinking-dot { width: 8px; height: 8px; background-color: var(--neon-green); border-radius: 50%; display: inline-block; margin-right: 6px; animation: blink 1.2s infinite; box-shadow: 0 0 12px var(--neon-green); }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        .numbers-container { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        .num-block { background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(0, 102, 204, 0.4)); border: 1px solid rgba(0, 229, 255, 0.4); color: #fff; padding: 10px 0; width: 90px; border-radius: 14px; box-shadow: 0 0 25px rgba(0, 229, 255, 0.3); text-align: center; }
        .num-main-val { font-size: 34px; font-weight: 900; font-family: monospace; display: block; text-shadow: 0 0 10px #fff; }
        .num-sub-lbl { font-size: 10px; letter-spacing: 1px; color: #aaa; text-transform: uppercase; }
        .color-badge { font-size: 28px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 20px rgba(255,255,255,0.25); }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <h1 style="color: var(--gold); text-shadow: 0 0 25px rgba(255,170,0,0.6);">💎 WIN WITH HACKII 💎</h1>
        <h2 style="color: var(--neon-cyan);">ADVANCED DETECTIVE TELEMETRY</h2>
        
        <div style="background: rgba(0,0,0,0.4); padding: 14px; border-radius: 14px; margin-bottom: 22px; border: 1px solid rgba(255,255,255,0.04);">
            <p style="font-size: 12px; color: #b3b3b3;"><span class="blinking-dot"></span> DETECTIVE STREAM: <span style="color:var(--neon-green);">ACTIVE ANALYSIS</span></p>
            <p style="font-size: 12px; color: #b3b3b3;">Terminal Node: <span id="myUidDisplay" style="color:var(--neon-cyan);"> - </span></p>
        </div>

        <div class="timer-box" id="timerDisplay">⏳ NEXT HORIZON REFRESH: 00:00s</div>

        <div class="prediction-box">
            <h3 style="color:var(--neon-pink);">⚡ HIGH-LEVEL CORE PREDICTOR ⚡</h3>
            <h2 id="periodId" style="color: #fff; font-family: monospace;">Period: <span>----</span></h2>
            <div id="colorResult" class="color-badge">-</div>
            <div class="numbers-container">
                <div class="num-block">
                    <span id="predictNumberSmall" class="num-main-val">-</span>
                    <span class="num-sub-lbl">Pattern A</span>
                </div>
                <div class="num-block">
                    <span id="predictNumberBig" class="num-main-val">-</span>
                    <span class="num-sub-lbl">Pattern B</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        socket.on('predictionUpdate', (data) => {
            document.getElementById('periodId').innerHTML = `Period: <span style="color:var(--neon-cyan);">${data.period}</span>`;
            document.getElementById('predictNumberSmall').innerText = data.numberSmall;
            document.getElementById('predictNumberBig').innerText = data.numberBig;
            let clr = document.getElementById('colorResult');
            clr.innerText = data.color;
            clr.style.color = (data.color === "GREEN") ? "var(--neon-green)" : (data.color === "RED" ? "var(--neon-red)" : "#fff");
        });

        // Countdown wahi purana
        setInterval(() => {
            const sec = 60 - new Date().getSeconds();
            document.getElementById('timerDisplay').innerText = `⏳ NEXT HORIZON REFRESH: 00:${sec < 10 ? '0'+sec : sec}s`;
        }, 1000);
    </script>
</body>
</html>
